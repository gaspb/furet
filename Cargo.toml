[workspace]
resolver = "3"
members = ["crates/*"]
# The native app pulls in GPUI: build it on purpose (cargo build -p dbx-app).
default-members = ["crates/common", "crates/dbx"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/gaspb/tui-tools"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
common = { path = "crates/common" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
