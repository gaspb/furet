[package]
name = "furet"
version = "0.3.0"
description = "Postgres and ClickHouse per repo: tunnels, read-only remotes, rows you can follow, for you and your agents"
keywords = ["postgres", "clickhouse", "cli", "tui", "database"]
categories = ["command-line-utilities"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
common.workspace = true
libc = "0.2"
postgres = "0.19"
ratatui.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tiny_http = "0.12"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
toml = "1.2"
toml_edit = "0.25"
tokio-postgres-rustls = "0.14"
url = "2.5"
webpki-roots = "1"

[workspace]
resolver = "3"
members = [".", "crates/*"]
# The native app pulls in GPUI: build it on purpose (cargo build -p furet-app).
default-members = [".", "crates/common"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/gaspb/furet"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
common = { path = "crates/common" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
